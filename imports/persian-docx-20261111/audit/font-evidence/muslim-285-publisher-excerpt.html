<p><span class="matn">
۲۸۵-<span class="KFGQPC1"> عَنْ سِمَاكِ بْنِ حَرْبٍ قَالَ: سَأَلْتُ جَابِرَ بْنَ سَمُرَةَ<span class="symbol"> س </span>عَنْ صَلاةِ النَّبِيِّ<span class="symbol"> ص </span>فَقَالَ: كَانَ يُخَفِّفُ الصَّلاةَ، وَلاَ يُصَلِّي صَلاةَ هَؤُلاءِ، قَالَ: وَأَنْبَأَنِي أَنَّ رَسُولَ اللَّهِ<span class="symbol"> ص </span>كَانَ يَقْرَأُ فِي الْفَجْرِ<span class="symbol"> ب </span><span class="symbol">﴿</span><span class="aya"> قٓۚ وَٱلۡقُرۡءَانِ</span><span class="symbol">﴾</span>وَنَحْوِهَا. </span>(م/۴۵۸)</span></p>
