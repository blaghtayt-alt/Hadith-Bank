name: Update Hadith Bank website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep main's build, generated commit and deployment in order. A newer PR
# revision may cancel its older validation; a live deployment is not canceled.
concurrency:
  group: hadith-bank-reader-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate proposed material and reader
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out proposed revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run software tests
        run: |
          python -m unittest discover -s tests
          node --test tests/test_lazy_store.js
          node --test tests/test_discovery_engine.js
      - name: Install reader browser test runtime
        run: |
          python -m pip install --disable-pip-version-check playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Verify discovery interaction fixtures before the corpus build
        run: python scripts/verify_discovery_browser.py --report .work/discovery-fixture-smoke.json
      - name: Export saved Fawaz reviews and preserve published quotations
        run: python scripts/refresh_fawaz_reviewed.py --root .
      - name: Apply changed saved website reviews before shared validation
        # Apply source-bound decisions offline before any consumer reads the
        # shared material registry. This does not fetch or resume source URLs.
        run: python scripts/web_import_batch.py --root . --reviews-only
      - name: Save bounded Fawaz validation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fawaz-review-diagnostics-${{ github.job }}
          path: |
            .work/fawaz-reviewed-refresh/run-*/status.json
            .work/fawaz-reviewed-refresh/run-*/events.jsonl
            .work/fawaz-reviewed-refresh/run-*/candidate-audit.json
            .work/fawaz-reviewed-refresh/run-*/baseline-audit.json
            .work/fawaz-reviewed-refresh/run-*/git.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Rebuild and validate all registered material
        run: python scripts/refresh_bank.py --root . --site-output _site
      - name: Verify bounded reader in Chromium
        run: python scripts/verify_reader_browser.py --site-root _site --report .work/reader-browser-smoke.json
      - name: Verify searchable bank journeys and accessibility in Chromium
        run: python scripts/verify_discovery_browser.py --production-only --site-root _site --report .work/discovery-browser-smoke.json
      - name: Stage pinned pre-change search baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work/discovery-baseline
          git archive 3569d453cddc398275597e994c4d182b1e3a5539 \
            hadith-bank-reader.html hadith-bank-reader-data | tar -x -C .work/discovery-baseline
          cp .work/discovery-baseline/hadith-bank-reader.html .work/discovery-baseline/index.html
      - name: Measure cold and warm search on pinned baseline and candidate
        timeout-minutes: 20
        run: >-
          python scripts/benchmark_discovery_browser.py
          --baseline-site-root .work/discovery-baseline --site-root _site
          --report .work/discovery-benchmark.json --timeout-ms 120000 --require-candidate-complete
      - name: Save reader runtime evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: reader-runtime-${{ github.job }}
          path: |
            .work/reader-browser-smoke.json
            .work/discovery-fixture-smoke.json
            .work/discovery-browser-smoke.json
            .work/discovery-browser-images/
            .work/discovery-benchmark.json
            reports/portable-validation.json
            reports/site-build.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Refresh bank and build website
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
    outputs:
      publish: ${{ steps.sync.outputs.publish }}
      published_commit: ${{ steps.sync.outputs.published_commit }}
    steps:
      - name: Check out requested main revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run software tests
        run: |
          python -m unittest discover -s tests
          node --test tests/test_lazy_store.js
          node --test tests/test_discovery_engine.js
      - name: Install reader browser test runtime
        run: |
          python -m pip install --disable-pip-version-check playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Verify discovery interaction fixtures before the corpus build
        run: python scripts/verify_discovery_browser.py --report .work/discovery-fixture-smoke.json
      - name: Export saved Fawaz reviews and preserve published quotations
        run: python scripts/refresh_fawaz_reviewed.py --root .
      - name: Apply changed saved website reviews before shared validation
        # Apply source-bound decisions offline before any consumer reads the
        # shared material registry. This does not fetch or resume source URLs.
        run: python scripts/web_import_batch.py --root . --reviews-only
      - name: Save bounded Fawaz validation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fawaz-review-diagnostics-${{ github.job }}
          path: |
            .work/fawaz-reviewed-refresh/run-*/status.json
            .work/fawaz-reviewed-refresh/run-*/events.jsonl
            .work/fawaz-reviewed-refresh/run-*/candidate-audit.json
            .work/fawaz-reviewed-refresh/run-*/baseline-audit.json
            .work/fawaz-reviewed-refresh/run-*/git.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Synchronize official counterpart sources for newly registered IDs
        shell: bash
        run: |
          set -euo pipefail
          status=0
          python scripts/sync_hadeethenc_counterparts.py --root . || status=$?
          if [[ "$status" == 2 ]]; then
            echo "Some publisher IDs have no English export yet; their unmatched status is preserved."
          elif [[ "$status" != 0 ]]; then
            exit "$status"
          fi
      - name: Rebuild and validate all registered material
        run: python scripts/refresh_bank.py --root . --site-output _site
      - name: Verify bounded reader in Chromium
        run: python scripts/verify_reader_browser.py --site-root _site --report .work/reader-browser-smoke.json
      - name: Verify searchable bank journeys and accessibility in Chromium
        run: python scripts/verify_discovery_browser.py --production-only --site-root _site --report .work/discovery-browser-smoke.json
      - name: Save reader runtime evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: reader-runtime-${{ github.job }}
          path: |
            .work/reader-browser-smoke.json
            .work/discovery-fixture-smoke.json
            .work/discovery-browser-smoke.json
            .work/discovery-browser-images/
            reports/portable-validation.json
            reports/site-build.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep generated bank files synchronized
        id: sync
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -A -- catalog search browse index.json hadith-bank-reader.html \
            sources/counterparts reports/counterpart-coverage.json \
            reports/counterpart-availability.json reports/counterpart-availability.md \
            reports/counterpart-review \
            reports/reading-views-validation.json \
            reports/portable-validation.json reports/site-build.json
          if [[ -f catalog/fawaz-review-inputs.json ]]; then
            git add -A -- 'materials/fawaz-*' \
              imports/web-fawaz-20261112/classification \
              imports/web-fawaz-20261112/held \
              imports/web-fawaz-20261112/progress.json \
              imports/web-fawaz-20261112/source-integrity-validation.json
          fi
          python - <<'PY'
          from pathlib import Path
          import subprocess
          paths = [str(path) for pattern in ('imports/web-deenhindi-20261112', 'imports/web-uzbek-20261112',
              'imports/web-hadisuz-20261112', 'imports/web-import-status.json',
              'imports/web-import-worker-stops.json', 'materials/deenhindi-*',
              'materials/islom-*', 'materials/hadisuz-*' )
              for path in Path('.').glob(pattern)]
          if paths:
              subprocess.run(['git', 'add', '-A', '--', *paths], check=True)
          PY
          if [[ -d hadith-bank-reader-data ]]; then
            git add -A -- hadith-bank-reader-data
          fi
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Update generated Hadith Bank reader [skip ci]'
          fi
          # Token-authenticated source pushes do not trigger push workflows.
          # A superseded build explicitly requests the current main revision.
          python scripts/push_reader_commit.py --expected-start "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT" --request-current-build \
            --repository "$GITHUB_REPOSITORY"
      - name: Upload the verified website
        if: steps.sync.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1

  deploy:
    name: Publish verified website
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that this is still the current bank
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ needs.build.outputs.published_commit }}
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$current_main" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$current_main" == "$EXPECTED_COMMIT" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Main advanced before deployment; requesting its current build."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            gh workflow run reader-pages.yml --ref main --repo "$GITHUB_REPOSITORY"
          fi
      - name: Configure GitHub Pages
        if: steps.current.outputs.publish == 'true'
        uses: actions/configure-pages@v5
      - name: Deploy the verified artifact
        if: steps.current.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
