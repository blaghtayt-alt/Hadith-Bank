name: Restore preserved Chinese Ibn Majah source package

# Restore exact preserved bytes on the import branch. This job never runs OCR,
# changes source text, or publishes to main.
on:
  push:
    branches: [import/chinese-ibn-majah-direct-20261111]
    paths:
      - imports/chinese-ibn-majah-20261111/transport/**
      - scripts/restore_chinese_ibn_majah.py
      - tests/test_chinese_ibn_majah_transport.py
      - .github/workflows/prepare-chinese-ibn-majah.yml

permissions:
  contents: read

concurrency:
  group: restore-chinese-ibn-majah-${{ github.ref }}
  cancel-in-progress: false

jobs:
  restore:
    if: github.ref == 'refs/heads/import/chinese-ibn-majah-direct-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify transport guards
        run: python -m unittest discover -s tests -p test_chinese_ibn_majah_transport.py
      - name: Restore exact saved source and records
        run: python scripts/restore_chinese_ibn_majah.py --root .
      - name: Save verified files on the import branch
        env:
          IMPORT_BRANCH: import/chinese-ibn-majah-direct-20261111
        shell: bash
        run: |
          set -euo pipefail
          current_head="$(git ls-remote origin "refs/heads/$IMPORT_BRANCH" | cut -f1)"
          if [[ "$current_head" != "$GITHUB_SHA" ]]; then
            echo "The import branch changed; refusing to overwrite newer work."
            exit 1
          fi
          # Add exactly the paths in the pinned manifest, plus the integrity report.
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          manifest = json.loads(Path("imports/chinese-ibn-majah-20261111/transport/manifest.json").read_text())
          paths = [entry["path"] for entry in manifest["files"]]
          paths.append("reports/chinese-ibn-majah-transport.json")
          subprocess.run(["git", "add", "--", *paths], check=True)
          PY
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Restore verified Chinese Ibn Majah canonical source package'
            git push origin "HEAD:refs/heads/$IMPORT_BRANCH"
          fi
