name: Continue authorized website imports

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-web-hadith.yml'
      - 'catalog/web-import-plan.json'
      - 'scripts/import_deenhindi.py'
      - 'scripts/import_uzbek_web.py'
      - 'scripts/import_hadisuz.py'
      - 'scripts/web_import_batch.py'

permissions:
  contents: read

concurrency:
  group: hadith-bank-web-imports
  cancel-in-progress: false

jobs:
  resume:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out the current bank and saved source queues
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check importer and reader regressions
        id: regressions
        run: >-
          python scripts/run_logged_task.py run
          --job-dir .work/web-import-tests --cwd . --timeout 600 --
          python -m unittest discover -s tests
      - name: Resume bounded public-page batches
        id: batch
        run: >-
          python scripts/run_logged_task.py run
          --job-dir .work/web-import-run --cwd . --timeout 2400 --
          python scripts/web_import_batch.py --root .
      - name: Save validated source snapshots and queue checkpoints
        id: save
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          paths = [str(path) for pattern in ('imports/web-deenhindi-20261112', 'imports/web-uzbek-20261112',
              'imports/web-hadisuz-20261112',
              'imports/web-import-status.json', 'imports/web-import-worker-stops.json',
              'materials/deenhindi-*', 'materials/islom-*', 'materials/hadisuz-*') for path in Path('.').glob(pattern)]
          if paths:
              subprocess.run(['git', 'add', '-A', '--', *paths], check=True)
          PY
          if git diff --cached --quiet; then
            echo "No unfinished source pages or changed intake data."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Continue source-preserving multilingual website imports'
          for attempt in 1 2 3; do
            git fetch origin main
            before_push="$(git rev-parse refs/remotes/origin/main)"
            rebase_status=0
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              rebase origin/main || rebase_status=$?
            if [[ "$rebase_status" != 0 ]]; then
              # The global summary is regenerated from source checkpoints.
              # Resolve only that derived file; preserve every genuine source,
              # queue, control-state or code conflict as a visible failure.
              python - <<'PY'
          import subprocess
          conflicts = subprocess.run(
              ['git', 'diff', '--name-only', '--diff-filter=U'],
              capture_output=True, text=True, check=True).stdout.splitlines()
          if conflicts != ['imports/web-import-status.json']:
              raise SystemExit('Rebase needs review; conflicts are not limited to the derived import summary.')
          subprocess.run(['git', 'restore', '--source=origin/main', '--staged', '--worktree',
                          '--', 'imports/web-import-status.json'], check=True)
          PY
              GIT_EDITOR=true git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                rebase --continue
            fi
            # This also validates the integrated material registry. A newly
            # added provider legitimately changes global counts after rebase.
            python scripts/web_import_batch.py --root . --status-only
            git add -- imports/web-import-status.json
            git diff --exit-code -- imports materials
            if ! git diff --cached --quiet; then
              if [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]]; then
                # A summary-only local commit may have become empty in rebase.
                # Never amend a commit belonging to the concurrent writer.
                git -c user.name='github-actions[bot]' \
                  -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                  commit -m 'Refresh integrated website import checkpoint'
              else
                git -c user.name='github-actions[bot]' \
                  -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                  commit --amend --no-edit
              fi
            fi
            saved_commit="$(git rev-parse HEAD)"
            push_status=0
            git push origin HEAD:refs/heads/main || push_status=$?
            current_main="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
            [[ "$current_main" =~ ^[0-9a-f]{40}$ ]]
            if [[ "$current_main" == "$saved_commit" ]]; then
              echo "Confirmed source checkpoint on main: $saved_commit"
              exit 0
            fi
            if [[ "$current_main" == "$before_push" ]]; then
              echo "Source checkpoint was not saved; the remote did not advance."
              exit 1
            fi
            if [[ "$push_status" == 0 ]]; then
              git fetch origin main
              if git merge-base --is-ancestor "$saved_commit" origin/main; then
                echo "Confirmed source checkpoint retained by a newer main revision."
                exit 0
              fi
              echo "The saved source commit is not retained by current main."
              exit 1
            fi
            echo "Main advanced during push; revalidating the next normal attempt."
          done
          echo "Main kept advancing; retain this source checkpoint for the next run."
          exit 1
      - name: Request the website build after a saved or unchanged checkpoint
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        # A GITHUB_TOKEN source push does not trigger another workflow. Keep
        # dispatch separate so the next no-diff run can recover a lost request.
        run: gh workflow run reader-pages.yml --ref main
      - name: Continue the authorized Hindi queue after saved progress
        id: continuation
        env:
          GH_TOKEN: ${{ github.token }}
        # This step runs only after tests, validation, source save and reader
        # dispatch succeeded. The same concurrency group serializes batches.
        run: |
          python scripts/web_import_batch.py --root . --continuation-request > .work/web-import-batch/continuation-request.json
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          request = json.loads(Path('.work/web-import-batch/continuation-request.json').read_text())
          if request['continue']:
              print('Continuing validated source queues:', ', '.join(item['source'] for item in request['sources']))
              subprocess.run(['gh', 'workflow', 'run', 'import-web-hadith.yml', '--ref', 'main'], check=True)
          else:
              print('No productive authorized source requires another immediate batch.')
          PY
      - name: Record the run outcome and source progress
        if: always()
        env:
          REGRESSION_OUTCOME: ${{ steps.regressions.outcome }}
          BATCH_OUTCOME: ${{ steps.batch.outcome }}
          SAVE_OUTCOME: ${{ steps.save.outcome }}
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          context = {key: os.environ.get(key) for key in (
              'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_SHA',
              'REGRESSION_OUTCOME', 'BATCH_OUTCOME', 'SAVE_OUTCOME', 'DISPATCH_OUTCOME')}
          head = subprocess.run(['git', 'rev-parse', 'HEAD'], capture_output=True, text=True)
          context['checked_out_commit'] = head.stdout.strip() if head.returncode == 0 else None
          status_path = Path('imports/web-import-status.json')
          try:
              status = json.loads(status_path.read_text())
          except (OSError, ValueError) as error:
              status = {}
              context['status_read_error'] = str(error)
          folder = Path('.work/web-import-batch')
          folder.mkdir(parents=True, exist_ok=True)
          (folder / 'run-context.json').write_text(json.dumps(context, indent=2) + '\n')
          lines = ['## Website import checkpoint', '',
              'Tests: ' + str(context['REGRESSION_OUTCOME']) +
              '; batch: ' + str(context['BATCH_OUTCOME']) +
              '; source save: ' + str(context['SAVE_OUTCOME']) +
              '; website build request: ' + str(context['DISPATCH_OUTCOME']) + '.', '',
              'Counts below describe the available checkpoint; a failed save does not confirm publication.', '',
              '| Source | Fetched | Registered | Held | State |',
              '| --- | ---: | ---: | ---: | --- |']
          for item in status.get('source_status', []):
              lines.append('| {source} | {fetched_entries} | {registered_occurrences} | {held_entries} | {state} |'.format(
                  **{**item, 'state': item.get('state', 'unknown')}))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\n'.join(lines) + '\n')
          if status.get('requires_attention'):
              print('::warning::A source queue needs inspection. Its saved stop/checkpoint is retained; other authorized queues continue.')
          PY
      - name: Pause the finite schedule when no source can continue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          status = json.loads(Path('imports/web-import-status.json').read_text())
          if status.get('schedule_should_pause'):
              reason = 'All fetch queues are complete.' if status.get('fetch_queues_done') else 'No enabled source can continue; inspect the retained stop/checkpoint before re-enabling.'
              print(reason)
              subprocess.run(['gh', 'workflow', 'disable', 'import-web-hadith.yml'], check=True)
          PY
      - name: Retain diagnostic logs for every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-import-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          include-hidden-files: true
          path: |
            .work/web-import-tests/
            .work/web-import-run/
            .work/web-import-batch/
            imports/web-import-status.json
            imports/web-import-worker-stops.json
      - name: Preserve interrupted intake evidence for recovery
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: web-import-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          compression-level: 0
          include-hidden-files: true
          path: |
            .work/web-import-batch/
            imports/web-deenhindi-20261112/
            imports/web-uzbek-20261112/
            imports/web-hadisuz-20261112/
            imports/web-import-status.json
            imports/web-import-worker-stops.json
            materials/deenhindi-*/
            materials/islom-*/
            materials/hadisuz-*/
